{% extends "layout.html" %}

{% block title %} Home {% endblock %}

{% block main %}

<div class="container my-4">
    <div class="row align-items-center">
        <div class="col-md-7 text-start">
            <h1 class="fw-bold">Eating Better, Feeling Better</h1>
            <p class="text-muted">
                Find healthy meals from around the world, with nutritional information and main ingredients featured.
            </p>
            <div class="d-flex flex-wrap gap-2 mt-3">
                <a href="/generator" class="btn btn-success mt-2">Try the Meal Generator</a>
                <a href="/health" class="btn btn-warning mt-2 text-white">How Diet Affects Health</a>
            </div>
        </div>

        <div class="col-md-5 text-center mt-3 mt-md-0">
            <img src="{{ url_for('static', filename='images/greek-salad.jpg') }}" 
                alt="Fresh Greek Salad" 
                class="img-fluid rounded">
        </div>
    </div>
</div>



{% endblock %}
