{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}

<form action="/register" method="post" class="mx-auto mt-4" style="max-width: 320px;">

    <h2 class="fw-bold mb-3 text-center">Register</h2>

    <!-- ERROR ALERT BLOCK -->
    {% if error %}
        <div class="alert alert-danger text-center mb-3" role="alert">
            {{ error }}
        </div>
    {% endif %}    
    
    <div class="mb-3">
        <input autocomplete="off" autofocus class="form-control" name="username" placeholder="Username" type="text" required>
    </div>
    
    <div class="mb-3">
        <input class="form-control" name="password" placeholder="Password" type="password" required>
    </div>
    
    <div class="mb-3">
        <input class="form-control" name="confirmation" placeholder="Confirm Password" type="password" required>
    </div>
    
    <button class="btn btn-primary w-100" type="submit">Register</button>
    
    <div class="mt-3 text-center">
        <small class="text-muted">Already have an account? <a href="/login">Log In</a></small>
    </div>
</form>

{% endblock %}
