{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}

<form action="/login" method="post" class="mx-auto mt-4" style="max-width: 320px;">
    <h2 class="fw-bold mb-3 text-center">Log In</h2>        
        
    <div class="mb-3">
        <input autocomplete="off" autofocus class="form-control" name="username" placeholder="Username" type="text" required>
    </div>
    
    <div class="mb-3">
        <input class="form-control" name="password" placeholder="Password" type="password" required>
    </div>
    
    <button class="btn btn-primary w-100" type="submit">Log In</button>
    
     <div class="mt-3 text-center">
        <small class="text-muted">Don't have an account? <a href="/register" class="text-decoration-none fw-bold">Register</a></small>
    </div>

    </form>

   
{% endblock %}
